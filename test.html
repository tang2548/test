<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Learning Algorithms Visualizer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .active-tab {
      background-color: #3b82f6;
      color: white;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Navigation -->
  <aside class="w-full md:w-72 bg-slate-800 border-r border-slate-700 p-4 overflow-y-auto">
    <h1 class="text-xl font-bold text-blue-400 mb-6 flex items-center gap-2">
      🤖 ML Visualizer
    </h1>

    <!-- Supervised Learning -->
    <div class="mb-4">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Supervised Learning</h2>
      <div class="space-y-1">
        <button onclick="showTab('linear')" id="btn-linear" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition active-tab">1. Linear Regression</button>
        <button onclick="showTab('logistic')" id="btn-logistic" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">2. Logistic Regression</button>
        <button onclick="showTab('knn')" id="btn-knn" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">3. k-NN</button>
        <button onclick="showTab('dt')" id="btn-dt" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">4. Decision Tree</button>
        <button onclick="showTab('rf')" id="btn-rf" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">5. Random Forest</button>
        <button onclick="showTab('svm')" id="btn-svm" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">6. SVM</button>
      </div>
    </div>

    <!-- Unsupervised Learning -->
    <div class="mb-4">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Unsupervised Learning</h2>
      <div class="space-y-1">
        <button onclick="showTab('kmeans')" id="btn-kmeans" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">1. K-Means Clustering</button>
        <button onclick="showTab('pca')" id="btn-pca" class="tab-btn w-full text-left px-3 py-2 rounded text-sm hover:bg-slate-700 transition">2. PCA</button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 overflow-y-auto">
    <div class="max-w-4xl mx-auto">
      <header class="mb-6">
        <h2 id="algo-title" class="text-2xl font-bold text-white">Linear Regression</h2>
        <p id="algo-desc" class="text-slate-400 text-sm mt-1">โมเดลสำหรับการพยากรณ์ค่าเชิงตัวเลขแบบต่อเนื่อง (Continuous Value)</p>
      </header>

      <!-- Visualization Canvas -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
        <canvas id="mlChart" class="w-full max-h-[400px]"></canvas>
      </div>

      <!-- Controls & Parameters -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h3 class="font-semibold text-lg mb-3">ปรับแต่งพารามิเตอร์ (Parameters)</h3>
        <div class="flex items-center gap-4">
          <button onclick="updateChartData()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
            🔄 สุ่มข้อมูลใหม่ (Re-generate Data)
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentChart = null;
    let currentTab = 'linear';

    const algoInfo = {
      linear: { title: "1. Linear Regression", desc: "ใช้สร้างเส้นตรงพยากรณ์ความสัมพันธ์ของข้อมูลเชิงเส้น" },
      logistic: { title: "2. Logistic Regression", desc: "ใช้ในการจำแนกกลุ่ม (Classification) ด้วย Sigmoid Function" },
      knn: { title: "3. K-Nearest Neighbors (k-NN)", desc: "จำแนกกลุ่มข้อมูลตามความใกล้ชิดกับเพื่อนบ้าน k ตัวที่ใกล้ที่สุด" },
      dt: { title: "4. Decision Tree", desc: "โมเดลต้นไม้การตัดสินใจ แตกกิ่งตามเงื่อนไขเพื่อจำแนกข้อมูล" },
      rf: { title: "5. Random Forest", desc: "รวม Decision Tree หลายๆ ต้นเพื่อเพิ่มความแม่นยำในการพยากรณ์" },
      svm: { title: "6. Support Vector Machine (SVM)", desc: "หาเส้น/ระนาบ (Hyperplane) ที่แบ่งกลุ่มข้อมูลให้ออกจากกันได้ดีที่สุด" },
      kmeans: { title: "1. K-Means Clustering", desc: "จัดกลุ่มข้อมูลที่ไม่ระบุคำตอบออกเป็น K กลุ่มตามระยะห่างจากจุดศูนย์กลาง" },
      pca: { title: "2. Principal Component Analysis (PCA)", desc: "ลดจำนวนมิติของข้อมูล (Dimensionality Reduction) โดยยังคงรักษาข้อมูลสำคัญไว้" }
    };

    function showTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
      document.getElementById(`btn-${tabId}`).classList.add('active-tab');
      
      document.getElementById('algo-title').innerText = algoInfo[tabId].title;
      document.getElementById('algo-desc').innerText = algoInfo[tabId].desc;
      
      updateChartData();
    }

    function updateChartData() {
      const ctx = document.getElementById('mlChart').getContext('2d');
      if (currentChart) currentChart.destroy();

      let dataPoints = Array.from({length: 20}, () => ({
        x: Math.floor(Math.random() * 100),
        y: Math.floor(Math.random() * 100)
      }));

      currentChart = new Chart(ctx, {
        type: (currentTab === 'linear' || currentTab === 'pca') ? 'line' : 'scatter',
        data: {
          datasets: [{
            label: algoInfo[currentTab].title,
            data: dataPoints,
            backgroundColor: '#3b82f6',
            borderColor: '#60a5fa',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
          },
          plugins: {
            legend: { labels: { color: '#f8fafc' } }
          }
        }
      });
    }

    // Initialize chart on load
    window.onload = () => showTab('linear');
  </script>
</body>
</html>
