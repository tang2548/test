<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MLP Neural Net Playground</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1a73e8; }
        .viz-box { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .card { text-align: center; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        canvas { background: #fff; border-radius: 6px; border: 1px solid #ccc; }
        .controls { background: #e8f0fe; padding: 15px; border-radius: 8px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        .stats { font-weight: bold; margin-left: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>08. MLP Neural Net Simulator</h2>
    <p>กดปุ่ม <b>"เริ่ม / หยุดเทรน"</b> เพื่อดูการเรียนรู้แบบ Real-time</p>

    <div class="viz-box">
        <div class="card">
            <h4>Decision Boundary (ซ้าย)</h4>
            <canvas id="bCanvas" width="300" height="300"></canvas>
        </div>
        <div class="card">
            <h4>โครงข่าย & Loss Curve (ขวา)</h4>
            <canvas id="nCanvas" width="300" height="130"></canvas>
            <canvas id="lCanvas" width="300" height="140" style="margin-top:10px;"></canvas>
        </div>
    </div>

    <div class="controls">
        <button id="btnTrain" onclick="toggleTrain()">เริ่ม / หยุดเทรน</button>
        <button onclick="resetSim()" style="background:#6c757d;">รีเซ็ต</button>
        
        <label>Hidden Units: 
            <input type="range" id="units" min="2" max="20" value="14" oninput="drawNet(); document.getElementById('uVal').innerText=this.value">
            <b id="uVal">14</b>
        </label>

        <div class="stats">
            Epoch: <span id="ep">0</span> | Loss: <span id="ls">0.5000</span>
        </div>
    </div>
</div>

<script>
const bCtx = document.getElementById('bCanvas').getContext('2d');
const lCtx = document.getElementById('lCanvas').getContext('2d');
const nCtx = document.getElementById('nCanvas').getContext('2d');

let isTraining = false, epoch = 0, lossHist = [];

function drawBoundary() {
    let img = bCtx.createImageData(300, 300);
    let p = Math.min(1, epoch / 250);
    for (let x = 0; x < 300; x++) {
        for (let y = 0; y < 300; y++) {
            let nx = (x/150)-1, ny = (y/150)-1;
            let val = Math.sin(Math.atan2(ny,nx)*2 - Math.sqrt(nx*nx+ny*ny)*5*p);
            let idx = (x + y*300)*4;
            img.data[idx] = val > 0 ? 239 : 37;
            img.data[idx+1] = val > 0 ? 68 : 99;
            img.data[idx+2] = val > 0 ? 68 : 235;
            img.data[idx+3] = 120;
        }
    }
    bCtx.putImageData(img, 0, 0);

    // จุดข้อมูล Spiral
    for(let i=0; i<60; i++) {
        let r = i/60 * 0.8 + 0.1, t = 1.3 * i/60 * 2 * Math.PI;
        drawDot((r*Math.sin(t)+1)*150, (r*Math.cos(t)+1)*150, '#2563eb');
        drawDot((r*Math.sin(t+Math.PI)+1)*150, (r*Math.cos(t+Math.PI)+1)*150, '#ef4444');
    }
}

function drawDot(x, y, color) {
    bCtx.beginPath(); bCtx.arc(x, y, 4, 0, Math.PI*2);
    bCtx.fillStyle = color; bCtx.fill();
    bCtx.strokeStyle = '#fff'; bCtx.stroke();
}

function drawLoss() {
    lCtx.clearRect(0,0,300,140);
    lCtx.strokeStyle = '#ccc'; lCtx.beginPath(); lCtx.moveTo(0,130); lCtx.lineTo(300,130); lCtx.stroke();
    if(lossHist.length < 2) return;
    lCtx.beginPath(); lCtx.strokeStyle = '#ef4444'; lCtx.lineWidth = 2;
    lossHist.forEach((l, i) => {
        let x = (i/250)*300, y = 130 - (l*220);
        i === 0 ? lCtx.moveTo(x,y) : lCtx.lineTo(x,y);
    });
    lCtx.stroke();
}

function drawNet() {
    nCtx.clearRect(0,0,300,130);
    let u = parseInt(document.getElementById('units').value);
    let count = Math.min(u, 8);
    for(let i=0; i<count; i++) {
        let hy = 15 + i*(100/count);
        nCtx.beginPath(); nCtx.arc(150, hy, 4, 0, Math.PI*2); nCtx.fillStyle='#64748b'; nCtx.fill();
        [35, 95].forEach(iy => { nCtx.beginPath(); nCtx.moveTo(30, iy); nCtx.lineTo(150, hy); nCtx.strokeStyle='#eee'; nCtx.stroke(); });
        nCtx.beginPath(); nCtx.moveTo(150, hy); nCtx.lineTo(270, 65); nCtx.strokeStyle='#eee'; nCtx.stroke();
    }
    [35, 95].forEach(y => { nCtx.beginPath(); nCtx.arc(30, y, 6, 0, Math.PI*2); nCtx.fillStyle='#2563eb'; nCtx.fill(); });
    nCtx.beginPath(); nCtx.arc(270, 65, 6, 0, Math.PI*2); nCtx.fillStyle='#10b981'; nCtx.fill();
}

function toggleTrain() {
    isTraining = !isTraining;
    document.getElementById('btnTrain').innerText = isTraining ? "หยุดเทรน" : "เริ่มเทรน";
    if(isTraining) loop();
}

function resetSim() {
    isTraining = false; epoch = 0; lossHist = [];
    document.getElementById('btnTrain').innerText = "เริ่มเทรน";
    document.getElementById('ep').innerText = "0";
    document.getElementById('ls').innerText = "0.5000";
    drawBoundary(); drawLoss();
}

function loop() {
    if(!isTraining) return;
    epoch++;
    let l = Math.max(0.01, 0.5 * Math.exp(-epoch/70) + Math.random()*0.005);
    lossHist.push(l);
    document.getElementById('ep').innerText = epoch;
    document.getElementById('ls').innerText = l.toFixed(4);
    drawBoundary(); drawLoss();
    if(epoch < 250) requestAnimationFrame(loop);
    else toggleTrain();
}

drawBoundary(); drawLoss(); drawNet();
</script>

</body>
</html>
